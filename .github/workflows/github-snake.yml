name: Generate contribution snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: dhanshrimule347-eng
          outputs: |
            dist/github-snake-dark.svg?color_snake=%2322d3ee,%2338bdf8,%23ff9900&color_dots=%230d1626,%23233144,%23233144,%2338bdf8,%2322d3ee&color_empty=%23101a2b
            dist/github-snake-light.svg?color_snake=%230e7490,%230369a1,%23c2410c&color_dots=%23f6f8fb,%23d7dee8,%23d7dee8,%230369a1,%230e7490&color_empty=%23eef2f8
            dist/github-snake-cyan.svg?color_snake=%2322d3ee&color_dots=%230d1626,%23233144,%2338bdf8,%2322d3ee,%23ff9900
            dist/github-snake.gif?color_snake=%2322d3ee,%2338bdf8,%23ff9900&color_dots=%230d1626,%23233144,%23233144,%2338bdf8,%2322d3ee

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
