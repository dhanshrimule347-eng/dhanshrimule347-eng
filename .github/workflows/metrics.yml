name: Generate GitHub Metrics 📊

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate metrics (stats + languages + achievements + calendar)
        uses: lowlighter/metrics@latest
        with:
          # Use a Personal Access Token, not the default GITHUB_TOKEN —
          # the achievements/languages plugins need broader read scopes
          # than the default token grants. See README setup notes below.
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhanshrimule347-eng
          filename: metrics.svg
          template: classic

          base: "header, activity, community, repositories, metadata"

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_threshold: 2
          plugin_languages_limit: 8

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Kolkata
